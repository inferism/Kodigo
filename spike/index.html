<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kodigo spike</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0 auto; max-width: 56rem; padding: 1rem; background: #14161a; color: #e6e6e6; font: 16px system-ui, sans-serif; }
    textarea, pre { box-sizing: border-box; width: 100%; padding: .75rem; border: 1px solid #333; border-radius: 6px; background: #1c1f24; color: inherit; font: 14px/1.5 ui-monospace, Consolas, monospace; }
    textarea { height: 16rem; }
    pre { min-height: 8rem; white-space: pre-wrap; }
    button { padding: .5rem 1rem; }
    input { box-sizing: border-box; width: 100%; padding: .5rem .75rem; border: 1px solid #333; border-radius: 6px; background: #1c1f24; color: inherit; font: 14px ui-monospace, Consolas, monospace; }
    .stderr { color: #ff8f8f; }
  </style>
</head>
<body>
  <h1>Kodigo spike</h1>
  <textarea id="source" spellcheck="false" aria-label="Java source">public class Main {
    public static void main(String[] args) {
        System.out.println("Hello from javac in the browser");
    }
}</textarea>
  <p><button id="run" disabled>Run</button> <button id="stop" disabled>Stop</button> <span id="status" role="status">Loading CheerpJ…</span></p>
  <pre id="console"></pre>
  <p><input id="stdin" disabled placeholder="Input for your program, press Enter to send" aria-label="Program input"></p>
  <p>Built with CheerpJ</p>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    let runner;

    function print(text, className) {
      const span = document.createElement('span');
      span.className = className ?? '';
      span.textContent = text;
      $('console').append(span);
    }

    // Java blocks on this promise until the user presses Enter.
    function readLine() {
      $('stdin').disabled = false;
      $('stdin').focus();
      $('status').textContent = 'Waiting for input…';
      return new Promise((resolve) => {
        $('stdin').onkeydown = (event) => {
          if (event.key !== 'Enter') return;
          const line = $('stdin').value;
          $('stdin').value = '';
          $('stdin').disabled = true;
          $('status').textContent = 'Running…';
          print(line + '\n', 'stdin');
          resolve(line);
        };
      });
    }

    function startRunner() {
      $('run').disabled = true;
      $('stop').disabled = true;
      $('stdin').disabled = true;
      $('status').textContent = 'Loading CheerpJ…';
      runner = document.createElement('iframe');
      runner.src = 'runner.html';
      runner.title = 'Java runner';
      runner.hidden = true;
      document.body.append(runner);
    }

    async function run() {
      $('run').disabled = true;
      $('stop').disabled = false;
      $('console').textContent = '';
      const current = runner;
      const result = await current.contentWindow.compileAndRun($('source').value);
      if (current !== runner) return;
      $('status').textContent = JSON.stringify(result);
      $('run').disabled = false;
      $('stop').disabled = true;
    }

    function stop() {
      runner.remove();
      print('\nStopped.\n', 'stderr');
      startRunner();
    }

    // runner.html calls these from inside its iframe.
    window.kodigo = {
      print,
      readLine,
      status: (text) => { $('status').textContent = text; },
      ready: (ms) => {
        $('status').textContent = `Ready, init ${ms} ms`;
        $('run').disabled = false;
        window.spikeRun = run;
      },
    };

    $('run').onclick = run;
    $('stop').onclick = stop;
    startRunner();
  </script>
</body>
</html>
