<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Kodigo: compiler</title>
  <script>try { if (localStorage.getItem('kodigo-theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/theme.css">
  <link rel="stylesheet" href="/src/compiler.css">
</head>
<body>
  <header>
    <a class="brand" href="/">Kodigo</a>
    <span id="language-label"></span>
    <button type="button" id="theme-toggle" class="theme-toggle">
      <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>
  <main>
    <div class="workspace">
      <div class="toolbar">
        <button type="button" id="run" disabled>Run</button>
        <button type="button" id="stop" hidden>Stop</button>
        <progress id="load-progress" max="100" hidden></progress>
        <span id="status" role="status"></span>
      </div>
      <div id="editor" aria-label="Code editor"></div>
      <section class="output" aria-labelledby="output-title">
        <div class="output-bar">
          <h2 id="output-title">Output</h2>
          <button type="button" id="clear-output">Clear</button>
        </div>
        <pre id="output" role="log" tabindex="0"></pre>
      </section>
    </div>
    <aside id="guide" class="guide" aria-labelledby="guide-title">
      <h2 id="guide-title"><button type="button" class="guide-toggle" aria-expanded="true" aria-controls="guide-body">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Guide</span>
      </button></h2>
      <div id="guide-body" class="guide-body"></div>
    </aside>
  </main>
  <footer>
    <p>Built with <a href="https://cheerpj.com" rel="noopener">CheerpJ</a></p>
  </footer>
  <script type="module" src="/src/compiler.js"></script>
</body>
</html>
